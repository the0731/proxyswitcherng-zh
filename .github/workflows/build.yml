name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg xz

      - name: Set up Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/theos" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $RUNNER_TEMP/theos
          mkdir -p $RUNNER_TEMP/theos/sdks
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xJf /tmp/sdk.tar.xz -C $RUNNER_TEMP/theos/sdks

      - name: Build package
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: proxyswitcherng-zh-deb
          path: packages/*.deb
